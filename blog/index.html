---
layout: default
---

{{ site.baseurl }}
<h4>Helping You Write Well</h4>
{{ site.author }}

<div class="posts">
{{ post.author }}
</div>

<div class="posts">
  {% for post in site.posts %}
    <article class="post">

      <h2><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h2>
      {{ post.date }}<br>

      <div class="entry">
        {{ post.excerpt }}
      </div>

      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">[ Read More ]</a>
    </article>
  {% endfor %}
</div>

<h4>Helping You Write Well</h4>

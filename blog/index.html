---
layout: default
---

{{ site.baseurl }} | {{ site.baseurl }}/blog
<h4>Helping You Write Well</h4>

<p>Adam's Blog</p>

<div class="posts">
  {% for post in site.posts %}
    <article class="post">

      <h2><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h2>
      {{ post.date }}<br>
      By: {{ post.author }}<br>
        <br>
      <div class="entry">
        {{ post.excerpt }}
      </div>

      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">[ Read More ]</a>
    </article>
  {% endfor %}
</div>

<h4>Helping You Write Well</h4>

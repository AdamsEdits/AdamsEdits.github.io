---
layout: default
title: Tags
permalink: /blog/tag/
---

<h1>Tags</h1>

<ul>
  {% assign tags = site.tags | sort %}
  {% for tag in tags %}
    {% assign name = tag[0] %}
    {% assign posts = tag[1] %}
    <li>
      <a href="{{ '/blog/' | append: name | slugify | append: '/' | relative_url }}">
        {{ name }} ({{ posts | size }})
      </a>
    </li>
  {% endfor %}
</ul>

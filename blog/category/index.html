---
layout: default
title: Categories
permalink: /blog/category/
---

<h1>Categories</h1>

<ul>
  {% assign cats = site.categories | sort %}
  {% for category in cats %}
    {% assign name = category[0] %}
    {% assign posts = category[1] %}
    <li>
      <a href="{{ '/blog/category/' | append: name | slugify | append: '/' | relative_url }}">
        {{ name }} ({{ posts | size }})
      </a>
    </li>
  {% endfor %}
</ul>
